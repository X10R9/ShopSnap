<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片选择 - 电商图片提取助手</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2.5"></rect>
        <circle cx="8.5" cy="9.5" r="1.4" fill="currentColor" stroke="none"></circle>
        <path d="M4 17.2l4.6-4.6 3.1 3.1 3.4-3.4L20 17"></path>
      </svg>
    </span>
    <span class="brand-text">电商图片提取</span>
  </div>
  <div class="page-meta">
    <span class="site-chip" id="siteChip" hidden></span>
    <h1 class="page-title" id="pageTitle">正在读取提取结果…</h1>
    <p class="page-sub" id="pageSub"></p>
  </div>
</header>

<section class="toolbar" aria-label="筛选与批量操作">
  <div class="toolbar-group">
    <button type="button" class="btn ghost" data-act="select-all">全选</button>
    <button type="button" class="btn ghost" data-act="invert">反选</button>
    <button type="button" class="btn ghost" data-act="clear">清空</button>
  </div>
  <div class="toolbar-group filters">
    <label class="field">
      <span>来源</span>
      <select id="sourceFilter">
        <option value="all">全部</option>
        <option value="main">主图</option>
        <option value="sku">SKU 图</option>
        <option value="detail">详情图</option>
        <option value="other">其他</option>
      </select>
    </label>
    <label class="field">
      <span>最小边</span>
      <select id="minSide">
        <option value="0">不限</option>
        <option value="200" selected>≥ 200px</option>
        <option value="400">≥ 400px</option>
        <option value="800">≥ 800px</option>
        <option value="1200">≥ 1200px</option>
      </select>
    </label>
    <label class="field">
      <span>排序</span>
      <select id="sortBy">
        <option value="origin">原始顺序</option>
        <option value="size">按尺寸</option>
      </select>
    </label>
  </div>
</section>

<main class="content" id="content">
  <div class="grid" id="grid"></div>
  <div class="state" id="state" hidden>
    <div class="state-icon" id="stateIcon" aria-hidden="true"></div>
    <h2 class="state-title" id="stateTitle"></h2>
    <p class="state-desc" id="stateDesc"></p>
  </div>
</main>

<footer class="bottombar">
  <div class="summary">
    <span>已选 <b id="selCount">0</b> 张</span>
    <span class="dot">·</span>
    <span>共 <b id="totalCount">0</b> 张</span>
    <span class="dot">·</span>
    <span>预计 <b id="estSize">0 KB</b></span>
    <button type="button" class="link" id="retryFailed" hidden>重试失败项</button>
  </div>
  <div class="progress" id="progressWrap" hidden>
    <div class="progress-bar"><i id="progressBar"></i></div>
    <span class="progress-text" id="progressText">0 / 0</span>
  </div>
  <button type="button" class="btn primary" id="downloadBtn" disabled>下载选中为 PNG</button>
</footer>

<div class="preview" id="preview" tabindex="-1" hidden>
  <div class="preview-backdrop" data-act="close-preview"></div>

  <button type="button" class="preview-nav prev" data-act="prev" aria-label="上一张">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
  </button>

  <figure class="preview-stage">
    <img id="previewImg" alt="大图预览">
    <figcaption class="preview-caption">
      <span id="previewIndex"></span>
      <span id="previewDim"></span>
    </figcaption>
  </figure>

  <button type="button" class="preview-nav next" data-act="next" aria-label="下一张">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
  </button>

  <div class="preview-actions">
    <button type="button" class="btn ghost light" id="previewSelect">选择此图</button>
    <button type="button" class="btn primary" id="previewDownload">下载此图</button>
  </div>

  <button type="button" class="preview-close" data-act="close-preview" aria-label="关闭预览">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
  </button>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="../common/sites.js"></script>
<script src="../common/utils.js"></script>
<script src="gallery.js"></script>
</body>
</html>
